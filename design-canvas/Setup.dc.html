<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #FAF7F2; color: #1F1B16; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang HK", "Noto Sans TC", system-ui, sans-serif; font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #0F6E68; } a:hover { color: #0B5652; }
    .title { font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.6px; margin: 0; }
    .chip { display: inline-flex; align-items: center; justify-content: center; min-height: 58px; border-radius: 14px; background: #FFFFFF; font-size: 19px; font-weight: 600; box-shadow: 0 1px 2px rgba(31,27,22,.04), 0 6px 18px rgba(31,27,22,.045); }
    .foot { padding: 10px 20px 16px; border-top: 1px solid #EDE7DE; }
    .foot p { margin: 0; font-size: 12px; line-height: 1.45; color: #6B625A; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF7F2; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 22px 20px 0; display: flex; align-items: center; gap: 10px;">
    <span style="display: block; flex: 1; height: 4px; border-radius: 999px; background: #0F6E68;"></span>
    <span style="display: block; flex: 1; height: 4px; border-radius: 999px; background: #E4DED4;"></span>
  </div>

  <div style="flex: 1; padding: 40px 20px 0; display: flex; flex-direction: column; gap: 10px;">
    <h1 class="title">你煮飯畀邊個？</h1>
    <p style="margin: 0 0 22px; font-size: 16px; color: #6B625A;">淨係一個稱呼。唔使填名。</p>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div class="chip" style="background: #0F6E68; color: #FFFFFF; box-shadow: 0 6px 18px rgba(15,110,104,.24);">阿媽</div>
      <div class="chip">阿爸</div>
      <div class="chip">老豆</div>
      <div class="chip">家婆</div>
    </div>
    <div class="chip" style="margin-top: 12px; background: transparent; box-shadow: inset 0 0 0 1.5px #E4DED4; color: #6B625A; font-weight: 500;">其他稱呼…</div>
  </div>

  <div style="padding: 0 20px 18px; display: flex; flex-direction: column; gap: 14px;">
    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #6B625A;">只會存喺呢部電話，除咗你問嘅問題，乜都唔會傳出去。</p>
    <div style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; border-radius: 999px; background: #0F6E68; color: #FFFFFF; font-size: 18px; font-weight: 600; box-shadow: 0 6px 18px rgba(15,110,104,.24);">
      <span>下一步</span>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6l6 6-6 6"></path></svg>
    </div>
  </div>
  <div class="foot"><p>本工具只係幫你理解出院紙，唔係醫療建議，唔可以代替醫護人員嘅診斷同治療。有疑問請問返醫生或者藥劑師。AI 寫嘅內容可能有錯。</p></div>
</div>
</x-dc>
</body>
</html>
