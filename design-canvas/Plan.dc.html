<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #FAF7F2; color: #1F1B16; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang HK", "Noto Sans TC", system-ui, sans-serif; font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #0F6E68; } a:hover { color: #0B5652; }
    .title { font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.6px; margin: 0; }
    .sect { font-size: 13px; font-weight: 600; color: #6B625A; margin: 0 0 8px 4px; }
    .card { background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(31,27,22,0.04), 0 8px 24px rgba(31,27,22,0.045); overflow: hidden; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.2px; }
    .row { padding: 15px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .sep { height: 1px; background: #EDE7DE; margin-left: 18px; }
    .foot { padding: 10px 20px 16px; border-top: 1px solid #EDE7DE; }
    .foot p { margin: 0; font-size: 12px; line-height: 1.45; color: #6B625A; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF7F2; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 22px 20px 0; display: flex; align-items: center; justify-content: space-between;">
    <h1 class="title">計劃</h1>
    <span style="display: inline-flex; align-items: center; gap: 4px; min-height: 48px; color: #0F6E68; font-size: 16px; font-weight: 600;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6l-6 6 6 6"></path></svg>
      <span>張紙</span>
    </span>
  </div>

  <div style="flex: 1; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 22px; overflow: hidden;">

    <div>
      <p class="sect">覆診</p>
      <div class="card">
        <div class="row">
          <div style="display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 18px; font-weight: 600;">專科門診</span>
            <span style="font-size: 14px; color: #6B625A;">要空肚抽血</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="num" style="font-size: 17px; color: #6B625A;">2/52</span>
            <svg viewBox="0 0 24 16" width="17" height="12" fill="none" stroke="#0F6E68" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 13c0-5 2-8.5 6-10M11 13c0-5 2-8.5 6-10"></path></svg>
          </div>
        </div>
      </div>
      <p style="margin: 8px 0 0 4px; font-size: 13px; color: #6B625A;">照張紙寫嘅字，冇改過。</p>
    </div>

    <div>
      <p class="sect">食藥時間</p>
      <div class="card">
        <div class="row">
          <span class="num" style="font-size: 18px; font-weight: 600;">Amlodipine 5mg</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="num" style="font-size: 16px; color: #6B625A;">daily</span>
            <svg viewBox="0 0 24 16" width="17" height="12" fill="none" stroke="#0F6E68" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 13c0-5 2-8.5 6-10M11 13c0-5 2-8.5 6-10"></path></svg>
          </div>
        </div>
        <div class="sep"></div>
        <div class="row">
          <span class="num" style="font-size: 18px; font-weight: 600;">Metformin 500mg</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="num" style="font-size: 16px; color: #6B625A;">BD with meals</span>
            <svg viewBox="0 0 24 16" width="17" height="12" fill="none" stroke="#0F6E68" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 13c0-5 2-8.5 6-10M11 13c0-5 2-8.5 6-10"></path></svg>
          </div>
        </div>
        <div class="sep"></div>
        <div class="row">
          <span class="num" style="font-size: 18px; font-weight: 600;">Atorvastatin 20mg</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="num" style="font-size: 16px; color: #6B625A;">nocte</span>
            <svg viewBox="0 0 24 16" width="17" height="12" fill="none" stroke="#0F6E68" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 13c0-5 2-8.5 6-10M11 13c0-5 2-8.5 6-10"></path></svg>
          </div>
        </div>
      </div>
      <p style="margin: 8px 0 0 4px; font-size: 13px; color: #6B625A;">冇自己編過時間，張紙寫幾多次就係幾多次。</p>
    </div>
  </div>

  <div style="padding: 0 20px 16px; display: flex; flex-direction: column; gap: 10px;">
    <p style="margin: 0 4px; font-size: 13px; color: #6B625A;">撳確認之前，乜都唔會存。</p>
    <div style="display: inline-flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; background: #0F6E68; color: #FFFFFF; font-size: 18px; font-weight: 600; box-shadow: 0 6px 18px rgba(15,110,104,.24);">確認</div>
    <div style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; color: #0F6E68; font-size: 16px; font-weight: 600;">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
      <span>加入日曆</span>
    </div>
  </div>
  <div class="foot"><p>本工具只係幫你理解出院紙，唔係醫療建議，唔可以代替醫護人員嘅診斷同治療。有疑問請問返醫生或者藥劑師。AI 寫嘅內容可能有錯。</p></div>
</div>
</x-dc>
</body>
</html>
