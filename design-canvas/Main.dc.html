<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #FAF7F2; color: #1F1B16; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang HK", "Noto Sans TC", system-ui, sans-serif; font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #0F6E68; } a:hover { color: #0B5652; }
    .title { font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.6px; margin: 0; }
    .sect { font-size: 13px; font-weight: 600; color: #6B625A; margin: 0 0 8px 4px; letter-spacing: 0.1px; }
    .card { background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(31,27,22,0.04), 0 8px 24px rgba(31,27,22,0.045); }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.2px; }
    .foot { padding: 10px 20px 16px; border-top: 1px solid #EDE7DE; }
    .foot p { margin: 0; font-size: 12px; line-height: 1.45; color: #6B625A; }
    .pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 999px; font-weight: 600; }
    .quote { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 4px; color: #0F6E68; font-size: 15px; font-weight: 600; }
    @keyframes pulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: .16; transform: scale(1.06); } }
    @keyframes bars { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF7F2; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 22px 20px 0;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h1 class="title">出院紙</h1>
        <p style="margin: 0; font-size: 15px; color: #6B625A;">讀畀阿媽聽 · 示範紙</p>
      </div>
      <div style="display: flex; align-items: center; background: #EDE8E0; border-radius: 999px; padding: 3px;">
        <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 42px; height: 34px; border-radius: 999px; background: #FFFFFF; color: #1F1B16; font-size: 15px; font-weight: 600; box-shadow: 0 1px 3px rgba(31,27,22,.12);">繁</span>
        <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 42px; height: 34px; border-radius: 999px; color: #6B625A; font-size: 15px; font-weight: 500;">简</span>
      </div>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 22px;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <p class="sect">最緊要</p>
      <div style="background: #FFF1DF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(184,96,15,.06), 0 8px 24px rgba(184,96,15,.07);">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#B8600F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v5"></path><circle cx="12" cy="16.5" r=".6" fill="#B8600F"></circle><circle cx="12" cy="12" r="9"></circle></svg>
          <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #B8600F; letter-spacing: .2px;">警號</h2>
          <span style="flex: 1;"></span>
          <span style="font-size: 13px; color: #B8600F; opacity: .75;">1 / 3</span>
        </div>
        <p style="margin: 0; font-size: 24px; line-height: 1.4; font-weight: 700; letter-spacing: -0.3px;">如果胸口痛，即刻返急症室，唔好等。</p>
        <div style="display: flex; align-items: center; gap: 14px;">
          <div class="pill" style="position: relative; padding: 0 22px; background: #B8600F; color: #FFFFFF; font-size: 17px;">
            <span style="position: absolute; inset: -3px; border-radius: 999px; background: #B8600F; animation: pulse 1.7s ease-in-out infinite;"></span>
            <span style="position: relative; display: inline-flex; align-items: flex-end; gap: 3px; height: 17px;" aria-hidden="true">
              <span style="width: 3px; height: 17px; border-radius: 2px; background: #FFF1DF; transform-origin: bottom; animation: bars .9s ease-in-out infinite;"></span>
              <span style="width: 3px; height: 17px; border-radius: 2px; background: #FFF1DF; transform-origin: bottom; animation: bars .9s ease-in-out infinite .15s;"></span>
              <span style="width: 3px; height: 17px; border-radius: 2px; background: #FFF1DF; transform-origin: bottom; animation: bars .9s ease-in-out infinite .3s;"></span>
            </span>
            <span style="position: relative;">讀緊…</span>
          </div>
          <span class="quote" style="color: #B8600F;">
            <svg viewBox="0 0 24 16" width="18" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 13c0-5 2-8.5 6-10M11 13c0-5 2-8.5 6-10"></path></svg>
            <span style="text-decoration: underline; text-underline-offset: 4px;">睇原文</span>
          </span>
        </div>
        <div style="display: flex; gap: 6px; padding-top: 2px;">
          <span style="width: 22px; height: 3px; border-radius: 2px; background: #B8600F;"></span>
          <span style="width: 22px; height: 3px; border-radius: 2px; background: #B8600F; opacity: .25;"></span>
          <span style="width: 22px; height: 3px; border-radius: 2px; background: #B8600F; opacity: .25;"></span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <p class="sect">出院帶咗三隻藥</p>
      <div class="card" style="overflow: hidden;">
        <div style="padding: 16px 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <p class="num" style="margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.2px;">Amlodipine</p>
            <p style="margin: 0; font-size: 15px; color: #6B625A;">每日一次</p>
          </div>
          <p class="num" style="margin: 0; font-size: 17px; color: #6B625A; white-space: nowrap;">5mg · 1 tab</p>
        </div>
        <div style="height: 1px; background: #EDE7DE; margin-left: 18px;"></div>
        <div style="padding: 16px 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <p class="num" style="margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.2px;">Metformin</p>
            <p style="margin: 0; font-size: 15px; color: #6B625A;">每日兩次，隨餐</p>
          </div>
          <p class="num" style="margin: 0; font-size: 17px; color: #6B625A; white-space: nowrap;">500mg · 1 tab</p>
        </div>
        <div style="height: 1px; background: #EDE7DE; margin-left: 18px;"></div>
        <div style="padding: 16px 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <p class="num" style="margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.2px;">Atorvastatin</p>
            <p style="margin: 0; font-size: 15px; color: #6B625A;">每晚一次</p>
          </div>
          <p class="num" style="margin: 0; font-size: 17px; color: #6B625A; white-space: nowrap;">20mg · 1 tab</p>
        </div>
      </div>
      <p style="margin: 6px 0 0 4px; font-size: 13px; color: #6B625A;">照張紙一字不改。<span style="color: #0F6E68; font-weight: 600;">AI 寫嘅解釋可能有錯。</span></p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <p class="sect">覆診</p>
      <div class="card" style="padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <p style="margin: 0; font-size: 19px; font-weight: 600;">專科門診</p>
          <p style="margin: 0; font-size: 15px; color: #6B625A;">要空肚抽血</p>
        </div>
        <p class="num" style="margin: 0; font-size: 17px; color: #6B625A;">兩個禮拜後</p>
      </div>
    </div>
  </div>

  <div style="padding: 12px 20px 14px; display: flex; gap: 10px;">
    <div class="pill" style="flex: 1; min-height: 52px; background: #0F6E68; color: #FFFFFF; font-size: 17px; box-shadow: 0 6px 18px rgba(15,110,104,.24);">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h6A2.5 2.5 0 0 1 15 6.5v5A2.5 2.5 0 0 1 12.5 14H9l-4 3.5V14h-.5"></path><path d="M18 8.5a4 4 0 0 1 0 7"></path></svg>
      <span>全部讀出</span>
    </div>
    <div class="pill" style="flex: 1; min-height: 52px; background: #FFFFFF; color: #1F1B16; font-size: 17px; box-shadow: 0 1px 2px rgba(31,27,22,.05), 0 6px 18px rgba(31,27,22,.05);">問問題</div>
  </div>
  <div class="foot"><p>本工具只係幫你理解出院紙，唔係醫療建議，唔可以代替醫護人員嘅診斷同治療。有疑問請問返醫生或者藥劑師。AI 寫嘅內容可能有錯。</p></div>
</div>
</x-dc>
</body>
</html>
