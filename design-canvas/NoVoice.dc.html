<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #FAF7F2; color: #1F1B16; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang HK", "Noto Sans TC", system-ui, sans-serif; font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #0F6E68; } a:hover { color: #0B5652; }
    .title { font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.6px; margin: 0; }
    .sect { font-size: 13px; font-weight: 600; color: #6B625A; margin: 0 0 8px 4px; }
    .card { background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(31,27,22,0.04), 0 8px 24px rgba(31,27,22,0.045); }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.2px; }
    .foot { padding: 10px 20px 16px; border-top: 1px solid #EDE7DE; }
    .foot p { margin: 0; font-size: 12px; line-height: 1.45; color: #6B625A; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF7F2; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 22px 20px 0;">
    <h1 class="title">出院紙</h1>
  </div>

  <div style="flex: 1; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">

    <div style="display: flex; align-items: flex-start; gap: 12px; background: #F0EBE3; border-radius: 14px; padding: 14px 16px;">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#6B625A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <p style="margin: 0; font-size: 16px; font-weight: 600;">呢部電話冇廣東話聲</p>
        <p style="margin: 0; font-size: 14px; color: #6B625A;">字全部喺下面，一樣睇得到。</p>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <p class="sect">最緊要</p>
      <div style="background: #FFF1DF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#B8600F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v5"></path><circle cx="12" cy="16.5" r=".6" fill="#B8600F"></circle><circle cx="12" cy="12" r="9"></circle></svg>
          <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #B8600F;">警號</h2>
        </div>
        <p style="margin: 0; font-size: 22px; line-height: 1.45; font-weight: 700; letter-spacing: -0.3px;">如果胸口痛，即刻返急症室，唔好等。</p>
        <p style="margin: 0; font-size: 18px; line-height: 1.55;">如果唞唔到氣、好喘，即刻返急症室。</p>
        <p style="margin: 0; font-size: 18px; line-height: 1.55;">如果隻腳腫，即刻返急症室。</p>
        <span style="display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; color: #B8600F; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px;">
          <svg viewBox="0 0 24 16" width="17" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 13c0-5 2-8.5 6-10M11 13c0-5 2-8.5 6-10"></path></svg>
          <span>睇原文</span>
        </span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <p class="sect">出院帶咗三隻藥</p>
      <div class="card" style="overflow: hidden;">
        <div style="padding: 15px 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <p class="num" style="margin: 0; font-size: 18px; font-weight: 600;">Amlodipine</p>
            <p style="margin: 0; font-size: 14px; color: #6B625A;">每日一次</p>
          </div>
          <p class="num" style="margin: 0; font-size: 16px; color: #6B625A;">5mg · 1 tab</p>
        </div>
        <div style="height: 1px; background: #EDE7DE; margin-left: 18px;"></div>
        <div style="padding: 15px 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <p class="num" style="margin: 0; font-size: 18px; font-weight: 600;">Metformin</p>
            <p style="margin: 0; font-size: 14px; color: #6B625A;">每日兩次，隨餐</p>
          </div>
          <p class="num" style="margin: 0; font-size: 16px; color: #6B625A;">500mg · 1 tab</p>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 12px 20px 14px; display: flex; gap: 10px;">
    <div style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 999px; background: #F0EBE3; color: #6B625A; font-size: 17px; font-weight: 600;">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <span>睇字</span>
    </div>
    <div style="flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #FFFFFF; color: #1F1B16; font-size: 17px; font-weight: 600; box-shadow: 0 1px 2px rgba(31,27,22,.05), 0 6px 18px rgba(31,27,22,.05);">問問題</div>
  </div>
  <div class="foot"><p>本工具只係幫你理解出院紙，唔係醫療建議，唔可以代替醫護人員嘅診斷同治療。有疑問請問返醫生或者藥劑師。AI 寫嘅內容可能有錯。</p></div>
</div>
</x-dc>
</body>
</html>
