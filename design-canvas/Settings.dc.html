<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #FAF7F2; color: #1F1B16; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang HK", "Noto Sans TC", system-ui, sans-serif; font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #0F6E68; } a:hover { color: #0B5652; }
    .title { font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.6px; margin: 0; }
    .sect { font-size: 13px; font-weight: 600; color: #6B625A; margin: 0 0 8px 4px; }
    .card { background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(31,27,22,0.04), 0 8px 24px rgba(31,27,22,0.045); overflow: hidden; }
    .sep { height: 1px; background: #EDE7DE; margin-left: 18px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF7F2; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="padding: 22px 20px 0; display: flex; align-items: center; justify-content: space-between;">
    <h1 class="title">設定</h1>
    <span style="display: inline-flex; align-items: center; gap: 4px; min-height: 48px; color: #0F6E68; font-size: 16px; font-weight: 600;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6l-6 6 6 6"></path></svg>
      <span>返去</span>
    </span>
  </div>

  <div style="flex: 1; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 22px; overflow: hidden;">

    <div>
      <p class="sect">你嘅資料去咗邊</p>
      <div class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 12px;">
        <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1F1B16;">影嘅相同你問嘅問題，會傳去模型供應商喺香港以外嘅伺服器處理。</p>
        <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1F1B16;">呢個 app 冇伺服器儲存。張相處理完即刻掉咗，唔會留低，唔會記入 log。</p>
        <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1F1B16;">稱呼、計劃同讀過嘅紙淨係存喺你部電話。</p>
      </div>
    </div>

    <div>
      <p class="sect">佢做到啲咩</p>
      <div class="card">
        <div style="padding: 15px 18px; display: flex; align-items: flex-start; gap: 12px;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#0F6E68" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
          <span style="font-size: 16px; line-height: 1.55;">讀出張紙、答張紙上面嘅嘢、幫你整個計劃你確認</span>
        </div>
        <div class="sep"></div>
        <div style="padding: 15px 18px; display: flex; align-items: flex-start; gap: 12px;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#B5AB9F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          <span style="font-size: 16px; line-height: 1.55; color: #6B625A;">唔會斷症、唔會改藥、唔會幫你聯絡任何人</span>
        </div>
      </div>
    </div>

    <div>
      <p class="sect">字體</p>
      <div class="card" style="padding: 12px 14px;">
        <div style="display: flex; align-items: center; background: #EDE8E0; border-radius: 999px; padding: 3px;">
          <span style="flex: 1; display: inline-flex; align-items: center; justify-content: center; height: 40px; border-radius: 999px; background: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 1px 3px rgba(31,27,22,.12);">繁體</span>
          <span style="flex: 1; display: inline-flex; align-items: center; justify-content: center; height: 40px; border-radius: 999px; color: #6B625A; font-size: 16px;">简体</span>
        </div>
      </div>
    </div>

    <div class="card" style="padding: 16px 18px; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 17px; font-weight: 600; color: #B3402E;">刪除所有資料</span>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(31,27,22,.42);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 10px 12px; display: flex; flex-direction: column; gap: 8px;">
    <div style="background: rgba(255,255,255,.94); backdrop-filter: blur(20px); border-radius: 16px; overflow: hidden;">
      <div style="padding: 18px 20px; text-align: center; display: flex; flex-direction: column; gap: 6px;">
        <p style="margin: 0; font-size: 15px; font-weight: 600; color: #6B625A;">刪除所有資料？</p>
        <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #6B625A;">稱呼、計劃同讀過嘅紙會即刻喺呢部電話消失，冇得復原。</p>
      </div>
      <div style="height: 1px; background: #E4DED4;"></div>
      <div style="padding: 16px; text-align: center; font-size: 18px; font-weight: 600; color: #B3402E;">刪除</div>
    </div>
    <div style="background: rgba(255,255,255,.94); backdrop-filter: blur(20px); border-radius: 16px; padding: 16px; text-align: center; font-size: 18px; font-weight: 700; color: #0F6E68;">取消</div>
  </div>
</div>
</x-dc>
</body>
</html>
