<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #FAF7F2; color: #1F1B16; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang HK", "Noto Sans TC", system-ui, sans-serif; font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #0F6E68; } a:hover { color: #0B5652; }
    .title { font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.6px; margin: 0; }
    .card { background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(31,27,22,0.04), 0 8px 24px rgba(31,27,22,0.045); }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.2px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF7F2; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="padding: 22px 20px 0;">
    <h1 class="title">出院紙</h1>
  </div>
  <div style="flex: 1; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 22px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <p style="margin: 0 0 0 4px; font-size: 13px; font-weight: 600; color: #6B625A;">出院帶咗三隻藥</p>
      <div class="card" style="overflow: hidden;">
        <div style="padding: 16px 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 3px;">
            <p class="num" style="margin: 0; font-size: 19px; font-weight: 600;">Amlodipine</p>
            <p style="margin: 0; font-size: 15px; color: #6B625A;">每日一次</p>
          </div>
          <p class="num" style="margin: 0; font-size: 17px; color: #6B625A;">5mg · 1 tab</p>
        </div>
        <div style="height: 1px; background: #EDE7DE; margin-left: 18px;"></div>
        <div style="padding: 16px 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 3px;">
            <p class="num" style="margin: 0; font-size: 19px; font-weight: 600;">Metformin</p>
            <p style="margin: 0; font-size: 15px; color: #6B625A;">每日兩次，隨餐</p>
          </div>
          <p class="num" style="margin: 0; font-size: 17px; color: #6B625A;">500mg · 1 tab</p>
        </div>
      </div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(31,27,22,.42); backdrop-filter: blur(1.5px);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 26px 26px 0 0; padding: 12px 22px 30px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 -10px 34px rgba(31,27,22,.20);">
    <span style="width: 40px; height: 5px; border-radius: 999px; background: #E4DED4; align-self: center;"></span>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.3px;">張紙點寫</h2>
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 999px; background: #F0EBE3; color: #6B625A;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </span>
    </div>

    <div class="num" style="background: #F7F3EC; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px;">
      <p style="margin: 0; font-size: 12px; color: #6B625A; letter-spacing: .2px;">DISCHARGE MEDICATION(S) &amp; FOLLOW-UP PLAN · 第 1 行</p>
      <p style="margin: 0; font-size: 21px; line-height: 1.45; font-weight: 500;">Amlodipine 5mg 1 tab daily</p>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 10px;">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#6B625A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><circle cx="12" cy="8" r=".7" fill="#6B625A"></circle></svg>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #6B625A;">一字不改，照抄張紙。攞住張紙就可以對返。</p>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
