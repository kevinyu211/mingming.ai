<!doctype html>
<html>
<head>

<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #FAF7F2; color: #1F1B16; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang HK", "Noto Sans TC", system-ui, sans-serif; font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #0F6E68; } a:hover { color: #0B5652; }

<div style="width: 390px; height: 844px; background: #FAF7F2; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 22px 20px 0; display: flex; align-items: center; justify-content: space-between;">

        <p style="margin: 0; font-size: 17px; line-height: 1.5;">可唔可以唔食？</p>

    </div>

    <div class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 14px;">

        </span>
        <h2 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.2px;">呢樣要問藥劑師</h2>
      </div>
      <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #1F1B16;">藥點食、食唔食，張紙冇話得。呢樣要問藥劑師或者打張紙上面嘅電話。</p>
      <div class="num" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #F3EEE6; border-radius: 12px; padding: 14px 16px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 12px; color: #6B625A;">張紙上面嘅電話</span>
          <span style="font-size: 18px; font-weight: 600;">2xxx xxxx</span>
        </div>
        <span style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #0F6E68; color: #FFFFFF; font-size: 15px; font-weight: 600;">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1.1 1A16 16 0 0 1 4 5.1 1 1 0 0 1 5 4z"></path></svg>
          <span>打電話</span>
        </span>
      </div>
      <p style="margin: 0; font-size: 13px; color: #6B625A;">呢個答案冇經過 AI，係固定寫好嘅。</p>
    </div>
  </div>

  <div style="background: #F0EBE3; border-radius: 24px 24px 0 0; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: center; background: #E4DED4; border-radius: 999px; padding: 3px; align-self: center;">
      <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 76px; height: 32px; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 600; box-shadow: 0 1px 3px rgba(31,27,22,.12);">廣東話</span>
      <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 76px; height: 32px; border-radius: 999px; color: #6B625A; font-size: 14px; font-weight: 500;">普通話</span>
      <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 76px; height: 32px; border-radius: 999px; color: #6B625A; font-size: 14px; font-weight: 500;">English</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 999px; background: #FFFFFF; color: #0F6E68; box-shadow: 0 1px 3px rgba(31,27,22,.08);">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="10" rx="3"></rect><path d="M6 12a6 6 0 0 0 12 0"></path><path d="M12 18v3"></path></svg>
      </div>
      <div style="flex: 1; display: flex; align-items: center; height: 52px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; color: #9C9186; font-size: 16px; box-shadow: inset 0 0 0 1px rgba(31,27,22,.05);">打字問…</div>
    </div>
    <p style="margin: 0; text-align: center; font-size: 13px; color: #6B625A;">撳住講 · 或者打字問</p>
  </div>
  <div class="foot"><p>本工具只係幫你理解出院紙，唔係醫療建議，唔可以代替醫護人員嘅診斷同治療。有疑問請問返醫生或者藥劑師。AI 寫嘅內容可能有錯。</p></div>
</div>
</x-dc>
